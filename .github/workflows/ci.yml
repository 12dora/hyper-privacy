name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Privacy scan
        run: scripts/privacy-scan.sh

      # Internal test tools live in a private repository and must never land here.
      - name: No internal tools
        run: |
          if [ -e probe ] || grep -q ':probe' settings.gradle.kts; then
            echo "::error::internal probe module must not be in the public repository"; exit 1
          fi

      - name: Smell guard (suppression reasons, duplicated code)
        run: python3 -I scripts/smell-guard.py

      - name: Fail-open guard (hook exception modes, guarded hookers, no eager class init)
        run: |
          python3 -I scripts/test_failopen_guard.py
          python3 -I scripts/failopen-guard.py

      - uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.2 build-tools;37.0.0 ndk;30.0.16248370 cmake;4.1.2"

      - uses: gradle/actions/setup-gradle@v6

      - name: Native host tests (host table, ELF patcher; ASan + UBSan)
        run: scripts/native-test.sh

      - name: Check and build (unsigned release)
        run: ./gradlew check assembleRelease --stacktrace

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: "**/build/reports/"
          retention-days: 7
